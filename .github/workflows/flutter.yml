name: Flutter

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Flutter 3.35 (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze (must report no issues)
        run: flutter analyze

      - name: Run tests
        run: flutter test
